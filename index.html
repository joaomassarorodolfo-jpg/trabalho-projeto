<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Seguros e Pagamentos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Dashboard de Seguros & Pagamentos</h1>
        
        <!-- Cards de Resumo -->
        <div class="dashboard">
            <div class="card aprovado">
                <h3>Aprovados</h3>
                <p id="total-aprovado">R$ 0,00</p>
            </div>
            <div class="card pendente">
                <h3>Pendentes</h3>
                <p id="total-pendente">R$ 0,00</p>
            </div>
            <div class="card nao-pago">
                <h3>Não Pagos</h3>
                <p id="total-nao-pago">R$ 0,00</p>
            </div>
        </div>

        <!-- Filtros -->
        <div class="filtros">
            <button onclick="filtrarTabela('todos')">Todos</button>
            <button onclick="filtrarTabela('aprovado')">Aprovados</button>
            <button onclick="filtrarTabela('pendente')">Pendentes</button>
            <button onclick="filtrarTabela('nao_pago')">Não Pagos</button>
        </div>

        <!-- Tabela de Dados -->
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Seguro</th>
                    <th>Valor</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="tabela-corpo">
                <!-- Dados inseridos via JavaScript -->
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
